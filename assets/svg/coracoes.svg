<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="presentation" aria-hidden="true">
  <defs>
    <pattern id="ssl-coracoes" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">

      <!-- Coração central grande -->
      <path d="M40 30
               C42 21 56 21 56 32
               C56 45 40 55 40 55
               C40 55 24 45 24 32
               C24 21 38 21 40 30 Z"
            fill="#c9a86a"/>

      <!-- Arabesco superior esquerdo -->
      <path d="M6 6 Q10 1 14 6 Q18 11 22 6"
            stroke="#c9a86a" fill="none" stroke-width="1" stroke-linecap="round"/>
      <path d="M14 6 Q14 12 20 14"
            stroke="#c9a86a" fill="none" stroke-width="0.8" stroke-linecap="round"/>

      <!-- Arabesco inferior direito -->
      <path d="M58 74 Q62 69 66 74 Q70 79 74 74"
            stroke="#c9a86a" fill="none" stroke-width="1" stroke-linecap="round"/>
      <path d="M66 74 Q66 68 60 66"
            stroke="#c9a86a" fill="none" stroke-width="0.8" stroke-linecap="round"/>

      <!-- Coração pequeno — canto superior direito -->
      <path d="M65 14
               C66 10 72 10 72 14.5
               C72 19 65 23 65 23
               C65 23 58 19 58 14.5
               C58 10 64 10 65 14 Z"
            fill="#c9a86a" opacity="0.7"/>

      <!-- Coração pequeno — canto inferior esquerdo -->
      <path d="M15 66
               C16 62 22 62 22 66.5
               C22 71 15 75 15 75
               C15 75  8 71  8 66.5
               C 8 62 14 62 15 66 Z"
            fill="#c9a86a" opacity="0.7"/>

      <!-- Filete vertical sob o coração grande -->
      <line x1="40" y1="57" x2="40" y2="68" stroke="#c9a86a" stroke-width="0.6"/>
      <path d="M36 66 Q40 72 44 66"
            stroke="#c9a86a" fill="none" stroke-width="0.6" stroke-linecap="round"/>

      <!-- Pontos decorativos -->
      <circle cx="6"  cy="40" r="1.2" fill="#c9a86a" opacity="0.5"/>
      <circle cx="74" cy="40" r="1.2" fill="#c9a86a" opacity="0.5"/>
      <circle cx="40" cy="6"  r="1.2" fill="#c9a86a" opacity="0.5"/>

    </pattern>
  </defs>
  <rect width="160" height="160" fill="url(#ssl-coracoes)"/>
</svg>
